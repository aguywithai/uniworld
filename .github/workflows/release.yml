# Tag-driven release: verify, then publish to PyPI (wheels), crates.io, npm (WASM).
# Triggers: push tag v* (e.g. v0.2.0), or workflow_dispatch (tests only; no publish).
#
# GitHub Actions repository secrets (Settings -> Secrets and variables -> Actions):
#   PYPI_API_TOKEN       - PyPI API token (project-scoped recommended)
#   CARGO_REGISTRY_TOKEN - crates.io API token (crates.io profile email must be verified)
#   NPM_TOKEN            - npm automation/publish token
# Optional (future jobs): VSCE_PAT, PSGALLERY_API_KEY
#
# See _publishing/CHECKLIST.md for local .env names (same as secret names above).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  UcdVersion: "17.0.0"

jobs:
  verify:
    name: Test (Linux, UCD download)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Download UCD conformance data
        run: bash _development/scripts/download_ucd_tests.sh

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-release-cargo-

      - name: cargo test
        run: cargo test --release

  publish-pypi:
    name: Publish PyPI (maturin, ${{ matrix.os }})
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # maturin-action does not accept python-version; PyO3 follows PATH. Pin 3.12 so macOS
      # does not pick CPython 3.14 (PyO3 0.23 supports through 3.13 only).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish wheels (and sdist where applicable)
        uses: PyO3/maturin-action@v1
        with:
          command: publish
          args: --non-interactive --skip-existing
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  publish-crates-io:
    name: Publish crates.io
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Cargo reads CARGO_REGISTRY_TOKEN for crates.io. Retry on transient errors only.
      # If this version is already published, exit 0 (no pointless retries).
      - name: cargo publish
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            set +e
            OUT=$(cargo publish 2>&1)
            CODE=$?
            set -e
            printf '%s\n' "${OUT}"
            if [ "${CODE}" -eq 0 ]; then
              exit 0
            fi
            if echo "${OUT}" | grep -q "already exists"; then
              echo "crate version already on crates.io; done."
              exit 0
            fi
            echo "cargo publish failed (attempt ${attempt}), retrying in 45s..."
            sleep 45
          done
          exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-npm-wasm:
    name: Publish npm (WASM)
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          registry-url: https://registry.npmjs.org
          always-auth: true

      - name: Install Rust wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Ensure wasm32-unknown-unknown
        run: rustup target add wasm32-unknown-unknown

      # wasm-pack forwards --out-dir into cargo build; current Cargo rejects it (use wasm-bindgen-cli).
      - name: Build wasm (cargo)
        run: cargo build --release --target wasm32-unknown-unknown --features wasm

      - name: Install wasm-bindgen-cli (version matches wasm-bindgen crate)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y jq
          # wasm-bindgen is optional; without --all-features it is absent from metadata -> null.
          VER=$(cargo metadata --format-version 1 --all-features | jq -r '[.packages[] | select(.name == "wasm-bindgen") | .version] | unique | .[0]')
          if [ -z "${VER}" ] || [ "${VER}" = "null" ]; then
            echo "could not resolve wasm-bindgen from metadata; falling back to 0.2.100 (sync with Cargo.toml wasm-bindgen = \"0.2\")"
            VER="0.2.100"
          fi
          echo "wasm-bindgen-cli version: ${VER}"
          cargo install wasm-bindgen-cli --version "${VER}" --locked

      - name: wasm-bindgen emit and npm package.json
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pkg
          mkdir -p pkg
          wasm-bindgen target/wasm32-unknown-unknown/release/uniworld.wasm \
            --out-dir pkg \
            --target web \
            --typescript
          export VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          node <<'NODE'
          const fs = require("fs");
          const version = process.env.VERSION;
          const pkg = {
            name: "uniworld",
            version,
            description: "Correct Unicode text handling for every script: bidi, line breaking, segmentation, normalization",
            license: "MIT",
            repository: { type: "git", url: "https://github.com/aguywithai/uniworld" },
            main: "uniworld.js",
            types: "uniworld.d.ts",
          };
          fs.writeFileSync("pkg/package.json", JSON.stringify(pkg, null, 2) + "\n");
          NODE

      - name: npm publish
        working-directory: pkg
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

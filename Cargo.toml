[package]
name = "uniworld"
version = "0.2.0"
edition = "2021"
description = "Correct Unicode text handling for every script: bidi, line breaking, segmentation, normalization"
license = "MIT"
repository = "https://github.com/aguywithai/uniworld"
homepage = "https://aguywithai.world/opensource/uniworld/"
readme = "README.md"
# crates.io rejects uploads larger than 10 MiB (compressed). When `include` is set, only these
# paths are packaged; everything else (extensions/, docs PDFs, _publishing/, bindings/, etc.)
# stays in the git repo but is not shipped on crates.io. Full tree remains on GitHub for
# Python/maturin sdists, WASM npm builds, and VS Code/PowerShell packaging via CI.
include = [
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "CONTRIBUTING.md",
    "src/**",
    "tests/**",
]

[lib]
name = "uniworld"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]

[features]
default = []
# Enable when conformance test data is present
conformance = []
# Python bindings via PyO3 (use: maturin build --features python)
python = ["dep:pyo3"]
# JavaScript/WASM bindings (use: wasm-pack build --features wasm)
wasm = ["dep:wasm-bindgen"]
# C FFI bindings (use: cargo build --features cffi)
cffi = []
